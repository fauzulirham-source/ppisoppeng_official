  <!-- Proteksi DOM Engine dari Chrome Translate & Ekstensi Pihak Ketiga -->
  <script>
    if (typeof Node === 'function' && Node.prototype) {
      const originalRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function(child) {
        if (child.parentNode !== this) {
          if (console && console.warn) {
            console.warn("DOM Shield: Mencegah 'removeChild' crash akibat manipulasi Chrome Translate.", child, this);
          }
          return child;
        }
        return originalRemoveChild.apply(this, arguments);
      };

      const originalInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function(newNode, referenceNode) {
        if (referenceNode && referenceNode.parentNode !== this) {
          if (console && console.warn) {
            console.warn("DOM Shield: Mencegah 'insertBefore' crash akibat manipulasi Chrome Translate.", referenceNode, this);
          }
          return newNode;
        }
        return originalInsertBefore.apply(this, arguments);
      };
    }
  </script>

  <!-- GitHub Pages SPA Redirect Decoder -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
